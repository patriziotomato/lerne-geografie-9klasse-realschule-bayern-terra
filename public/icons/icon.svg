<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Geo-Quest">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b82ff"/>
      <stop offset="1" stop-color="#2ee6d0"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.34" cy="0.28" r="0.95">
      <stop offset="0" stop-color="#16233c"/>
      <stop offset="0.62" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#050a14"/>
    </radialGradient>
    <clipPath id="globe">
      <circle cx="256" cy="252" r="150"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>

  <!-- Kugel: dunkler Körper, damit das Gradnetz in Signaturfarbe darauf leuchtet -->
  <circle cx="256" cy="252" r="150" fill="url(#sphere)"/>

  <!-- Zwei angedeutete Landmassen: Charakter bei großer Darstellung,
       bei 48 px verschmelzen sie ruhig mit der Kugel. -->
  <g clip-path="url(#globe)" fill="#2ed77f" opacity="0.82">
    <path d="M124 198c12-28 40-50 72-46 23 3 32 21 50 25 16 4 31-7 41 5 10 12-1 28-14 37-17 12-23 29-42 36-25 9-54 6-75-9-19-14-26-31-32-48z"/>
    <path d="M258 326c11-23 36-36 61-33 21 2 35 14 54 12 15-2 27-13 36 0 8 13-3 29-15 39-15 13-21 31-40 37-23 8-50 2-67-13-15-13-23-29-29-42z"/>
    <path d="M300 160c15-9 34-4 40 8s-6 25-21 25-29-8-31-18 4-11 12-15z"/>
  </g>

  <g clip-path="url(#globe)" fill="none" stroke="#7ef0e2" stroke-width="5" opacity="0.85">
    <!-- Breitenkreise: orthographisch projiziert sind das waagerechte Sehnen -->
    <path d="M106 252h300M126 177h260M126 327h260M181 122h150M181 382h150"/>
    <!-- Längenkreise -->
    <path d="M256 102v300"/>
    <ellipse cx="256" cy="252" rx="75" ry="150"/>
    <ellipse cx="256" cy="252" rx="130" ry="150"/>
  </g>

  <circle cx="256" cy="252" r="150" fill="none" stroke="#050a14" stroke-width="9" opacity="0.55"/>
</svg>
