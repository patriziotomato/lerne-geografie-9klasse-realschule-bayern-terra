name: Deploy zu GitHub Pages

on:
  push:
    branches: [main]
  # Derselbe Build läuft schon am Pull Request. Ohne das ist der Deploy-Build der
  # erste automatisierte Build einer Änderung — ein Fehler darin wäre dann direkt
  # ein fehlgeschlagenes Live-Deployment statt eines roten Checks am PR.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Gruppe pro Ref: Ein PR-Build darf niemals ein laufendes Deployment von main
  # abbrechen. Zwei Pushes auf main teilen sich weiterhin eine Gruppe, dort bleibt
  # es also beim gewollten "der neuere gewinnt".
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Volle Historie samt Tags: vite.config.ts liest den Release-Stand über
      # `git describe`. Mit dem Standard (fetch-depth 1, ohne Tags) findet das
      # keinen Tag und die App zeigt statt des Releases die Nummer aus
      # package.json.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Mit derselben Umgebung wie das Deployment gebaut (inkl. base-Pfad), damit
      # der Check am PR wirklich das prüft, was später live geht.
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'

      # Ab hier nur noch Deployment-Vorbereitung: Ein Pull Request soll weder die
      # Pages-Einstellungen des Repos anfassen noch ein Artefakt hochladen.
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
